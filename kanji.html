<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste Meu Amigo Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="band">
  <h1>Teste de kanji — Meu Amigo Kanji I</h1>
  <p class="sub">As 80 palavras dos testes de leitura e escrita das unidades 1 a 20.</p>

  <div class="controls">
    <div class="seg" role="group" aria-label="Tipo de teste">
      <button id="m-kanji" aria-pressed="true">Teste de kanji</button>
      <button id="m-kana" aria-pressed="false">Teste de hiragana</button>
    </div>
    <div class="chips" id="units" role="group" aria-label="Unidades"></div>
  </div>

  <div class="score">
    <div class="stamp ok"><i class="jp">正</i><div><b id="s-ok">0</b><br><span>acertos</span></div></div>
    <div class="stamp ng"><i class="jp">誤</i><div><b id="s-ng">0</b><br><span>erros</span></div></div>
    <div class="prog"><span id="s-pos">1 / 40</span><div class="bar"><div id="s-bar"></div></div></div>
  </div>

  <section class="quiz" id="quiz">
    <div class="cellwrap">
      <div class="cell"><span class="q jp" id="q"></span></div>
      <span class="mean q-mean" id="q-mean"></span>
      <span class="unit" id="q-unit"></span>
    </div>
    <div class="side">
      <button class="switch" id="t-mean" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span>Mostrar tradução</button>
      <p class="ask" id="ask"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
  </section>

  <section class="end" id="end" hidden>
    <div class="big" id="e-pct"></div>
    <p id="e-txt"></p>
    <div class="actions">
      <button class="btn" id="e-again">Recomeçar</button>
      <button class="btn alt" id="e-miss">Treinar só os erros</button>
    </div>
    <ul class="miss" id="e-list"></ul>
  </section>

  <p class="hint">Atalho: teclas 1 a 4 escolhem a alternativa.</p>
</main>

<script src="js/data.js"></script>
<script src="js/options.js"></script>
<script src="js/app.js"></script>
</body>
</html>
